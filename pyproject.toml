[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-proxy"
version = "0.1.0"
description = "Thin FastMCP-based proxy that exposes multiple MCP servers as one."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.13.5",
  "fastmcp>=3.2.4,<4",
  "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]

[project.scripts]
mcp-proxy = "mcp_proxy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_proxy"]
